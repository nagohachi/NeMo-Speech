name: Claude Code Review (fork)

# Automated review for pull requests inside this fork (nagohachi/NeMo-Speech). The NVIDIA workflows of the upstream
# repository need NVIDIA's organization and runners and are disabled in the fork.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: github.repository == 'nagohachi/NeMo-Speech'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request as the maintainer of this repository does. The maintainer reviews design as
            well as correctness, and checks naming, tests and documentation as strictly as the code.

            1. Before anything else, fetch every comment already on the pull request:
               `gh api --paginate repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`
               (inline review comments and their replies) and
               `gh api --paginate repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments`
               (conversation comments). List the issues they raise and how each was answered.
               Do not raise any of those issues again, also when the answer kept the code and gave a reason.
            2. Read CLAUDE.md, `.claude/skills/nemo-speech-pr-review/SKILL.md`, the pull request (`gh pr view`),
               its diff (`gh pr diff`) and the files that the diff changes. The pull request may be one of a stack:
               review only its own diff against its base branch.
            3. Check the changed code for:
               - bugs: code that fails or gives wrong results;
               - violations of the rules in CLAUDE.md, quoting the rule, including the "Maintainer design rules"
                 and "Naming" sections;
               - the review rubric in `.claude/skills/nemo-speech-pr-review/SKILL.md`;
               - unit test coverage of the changed behavior and important edge cases, and whether the affected
                 documentation is accurate and complete ("PR Verification & Review" in CLAUDE.md).
               Skip formatting that pre-commit reports (black, isort, flake8).
            4. Post one inline comment per issue on the line it concerns
               (`mcp__github_inline_comment__create_inline_comment`), saying what is wrong, why, and what to
               change. Then post one summary comment (`gh pr comment`) that lists the issues from most to least
               important, or says that none were found and what was checked. Start the summary with the number of
               inline comments and of conversation comments read in step 1.

            Write the comments in Japanese. Do not change any file.
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*)"
